[project]
name = "agentic-dm-engine"
version = "0.1.0"
description = "Local-model AI Dungeon Master: deterministic D&D 5e engine, LangGraph orchestration, LoRA-distilled intent parsing, local image generation"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires the FastAPI service + DB running (skipped by default)",
    "llm: requires a live Ollama instance (skipped by default)",
]
addopts = "-m 'not integration and not llm'"

[tool.uv]
package = false
