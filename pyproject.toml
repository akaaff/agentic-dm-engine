[project]
name = "agentic-dm-engine"
version = "0.1.0"
description = "Local-model AI Dungeon Master: deterministic D&D 5e engine, LangGraph orchestration, LoRA-distilled intent parsing, local image generation"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.2",
    "langgraph>=1.2.11",
    "torch>=2.6.0",
    "diffusers>=0.40.0",
    "transformers>=5.16.1",
    "accelerate>=1.14.0",
    "safetensors>=0.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate` - hand-wrapping
# generator output defeats the point of autogeneration and would just get
# undone on the next `--autogenerate` pass anyway.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires the FastAPI service + DB running (skipped by default)",
    "llm: requires a live Ollama instance (skipped by default)",
    "imagegen: requires a CUDA GPU + the local SD-Turbo pipeline (skipped by default)",
]
addopts = "-m 'not integration and not llm and not imagegen'"

[tool.uv]
package = false
