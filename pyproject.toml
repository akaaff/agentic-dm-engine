[project]
name = "agentic-dm-engine"
version = "0.1.0"
description = "Local-model AI Dungeon Master: deterministic D&D 5e engine, LangGraph orchestration, LoRA-distilled intent parsing, local image generation"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.2",
    "langgraph>=1.2.11",
    "torch>=2.6.0",
    "diffusers>=0.40.0",
    "transformers>=5.16.1",
    "accelerate>=1.14.0",
    "safetensors>=0.8.0",
    "peft>=0.20.0",
    "trl>=0.20",
    "wandb>=0.29.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate` - hand-wrapping
# generator output defeats the point of autogeneration and would just get
# undone on the next `--autogenerate` pass anyway.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# datasets ships no py.typed marker; trl re-exports SFTConfig/SFTTrainer
# dynamically (a lazy-module __getattr__, not a plain assignment mypy can
# see statically) - torch/transformers/peft/diffusers already ship their
# own type info and don't need this.
module = ["datasets", "datasets.*", "trl", "trl.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires the FastAPI service + DB running (skipped by default)",
    "llm: requires a live Ollama instance (skipped by default)",
    "imagegen: requires a CUDA GPU + the local SD-Turbo pipeline (skipped by default)",
]
addopts = "-m 'not integration and not llm and not imagegen'"

[tool.uv]
package = false
# Day 16's cu124 PyTorch index mirrors its own (often stale) copies of
# common packages like `requests` - uv's default "first index wins" safe
# resolution then refuses to consider PyPI's newer version once it finds a
# match there, blocking any dependency (e.g. Day 26's trl/datasets) that
# needs a newer one. Both indexes here are ones this project explicitly
# configured and trusts (official PyPI + official PyTorch wheel index), so
# picking the best match across all of them - uv's own suggested fix for
# this exact situation - is safe, not the dependency-confusion risk this
# flag guards against for an untrusted third-party index.
index-strategy = "unsafe-best-match"
