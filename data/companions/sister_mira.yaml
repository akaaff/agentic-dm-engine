character_id: companion_mira
name: Sister Mira
persona: >
  A devout human cleric with an unshakeable calm - she has seen enough
  battlefields to know panic never saved a life, and quietly outlasts
  everyone's doubts.
race_index: human
class_index: cleric
background_index: acolyte
base_ability_scores: { STR: 13, DEX: 10, CON: 14, INT: 8, WIS: 15, CHA: 12 }
chosen_skills: [skill-medicine, skill-religion]
chosen_equipment: [mace, scale-mail]
gender: female
# Not chain-mail (Heavy) - a base Cleric's SRD proficiencies are only
# light/medium armor + shields, no heavy armor. Caught live wiring the
# equipment-proficiency restriction below; scale-mail (Medium, same AC
# formula as breastplate) keeps the "armored cleric" read while being
# proficiency-legal.
chosen_prepared_spells: [cure-wounds, healing-word, bless, shield-of-faith]
# WIS 15 + human's +1 = 16 (mod +3); prepared_spell_count("cleric", 1, 3)
# = max(1, 3+1) = 4. A battlefield-medic-shaped kit fitting her persona:
# two heals (one full-action, one bonus-action), a support buff, and an
# AC buff (issue #55's Shield of Faith).
