id: bandit_hideout
name: Bandit Hideout Showdown

battle_map:
  width: 7
  height: 5
  # terrain[y][x], y=0 is the top row
  terrain:
    - [floor, floor, floor, floor, floor, floor, floor]
    - [floor, wall, floor, difficult, floor, wall, floor]
    - [floor, floor, floor, floor, floor, floor, floor]
    - [floor, wall, floor, difficult, floor, wall, floor]
    - [floor, floor, floor, floor, floor, floor, floor]
  spawn_points:
    party_1: { x: 0, y: 2 }
    party_2: { x: 1, y: 1 }
    party_3: { x: 0, y: 0 }
    party_4: { x: 0, y: 3 }
    party_5: { x: 0, y: 4 }
    bandit_1: { x: 6, y: 1 }
    bandit_2: { x: 6, y: 3 }

monsters:
  - monster_index: bandit
    character_id: bandit_1
    spawn_point: bandit_1
  - monster_index: bandit
    character_id: bandit_2
    spawn_point: bandit_2

# See wolf_den.yaml's own comment - bumped to the true max party size (1 PC
# + up to 4 companions = 5), not just past whatever size first got reported.
party_spawn_points: [party_1, party_2, party_3, party_4, party_5]
