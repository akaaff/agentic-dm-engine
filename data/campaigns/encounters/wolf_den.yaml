id: wolf_den
name: Wolf Den Ambush

battle_map:
  width: 7
  height: 5
  # terrain[y][x], y=0 is the top row
  terrain:
    - [floor, floor, floor, floor, floor, floor, floor]
    - [floor, difficult, floor, floor, floor, wall, floor]
    - [floor, floor, floor, hazard, floor, floor, floor]
    - [floor, difficult, floor, floor, floor, wall, floor]
    - [floor, floor, floor, floor, floor, floor, floor]
  spawn_points:
    party_1: { x: 0, y: 2 }
    party_2: { x: 1, y: 3 }
    party_3: { x: 0, y: 3 }
    party_4: { x: 0, y: 1 }
    party_5: { x: 1, y: 4 }
    wolf_1: { x: 5, y: 1 }
    wolf_2: { x: 6, y: 2 }
    wolf_3: { x: 5, y: 3 }

monsters:
  - monster_index: wolf
    character_id: wolf_1
    spawn_point: wolf_1
  - monster_index: wolf
    character_id: wolf_2
    spawn_point: wolf_2
  - monster_index: wolf
    character_id: wolf_3
    spawn_point: wolf_3

# Issue live-found (2026-09-19): only 3 spawn points here, but a party can
# have up to 5 members (1 PC + up to 4 companions, see web/src/screens/
# PartySetup.tsx's MAX_COMPANIONS) - bumped to the true max instead of just
# past whatever party size happened to trigger the report this time, same
# gap this file already hit once before at 2 spawn points (see CLAUDE.md).
party_spawn_points: [party_1, party_2, party_3, party_4, party_5]
