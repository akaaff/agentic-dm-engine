id: kobold_ambush
name: Kobold Ambush

battle_map:
  width: 6
  height: 4
  # terrain[y][x], y=0 is the top row
  terrain:
    - [floor, floor, floor, floor, floor, floor]
    - [floor, floor, difficult, difficult, floor, floor]
    - [floor, floor, floor, floor, floor, floor]
    - [floor, floor, difficult, difficult, floor, floor]
  spawn_points:
    party_1: { x: 0, y: 1 }
    party_2: { x: 0, y: 2 }
    party_3: { x: 0, y: 0 }
    party_4: { x: 0, y: 3 }
    party_5: { x: 1, y: 2 }
    kobold_1: { x: 5, y: 0 }
    kobold_2: { x: 5, y: 2 }
    kobold_3: { x: 5, y: 3 }

monsters:
  - monster_index: kobold
    character_id: kobold_1
    spawn_point: kobold_1
  - monster_index: kobold
    character_id: kobold_2
    spawn_point: kobold_2
  - monster_index: kobold
    character_id: kobold_3
    spawn_point: kobold_3

# See wolf_den.yaml's own comment - bumped to the true max party size (1 PC
# + up to 4 companions = 5), not just past whatever size first got reported.
party_spawn_points: [party_1, party_2, party_3, party_4, party_5]
